services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      APP_TARGET: ${APP_TARGET:-travelplanner_5/main.py}
    ports:
      - "8501:8501"
    command:
      - /bin/sh
      - -c
      - exec streamlit run "$${APP_TARGET:-app/travelplanner_5/main.py}" --server.port 8501 --server.address 0.0.0.0
    stdin_open: true
    tty: true
