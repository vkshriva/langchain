services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      APP_TARGET: ${APP_TARGET:-travelplanner_5/main.py}
    command:
      - /bin/sh
      - -c
      - exec python "$${APP_TARGET:-main.py}"
    stdin_open: true
    tty: true
